
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Photobook — Sign In</title>
  <link rel="stylesheet" href="photobook.css?v=27">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <h1>Family Photobook</h1>
      <p class="subtitle">A place for our family memories.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit">Sign In</button>
        <p id="loginMessage" role="status"></p>
        <button id="forgotPasswordButton" class="text-link-button" type="button">Forgot password?</button>
      </form>
      <form id="forgotPasswordForm" hidden>
        <h2>Reset your password</h2>
        <p>Enter your account email and we will send a password reset link.</p>
        <label for="recoveryEmail">Email</label>
        <input type="email" id="recoveryEmail" autocomplete="email" required>
        <button type="submit">Send reset link</button>
        <button class="text-link-button" type="button" id="backToLoginButton">Back to sign in</button>
        <p id="recoveryMessage" role="status" aria-live="polite"></p>
      </form>
      <form id="newPasswordForm" hidden>
        <h2>Choose a new password</h2>
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" minlength="8" autocomplete="new-password" required>
        <label for="confirmNewPassword">Confirm new password</label>
        <input type="password" id="confirmNewPassword" minlength="8" autocomplete="new-password" required>
        <button type="submit">Save new password</button>
        <p id="newPasswordMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="photobook.js?v=27"></script>
</body>
</html>
