<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hustle Team Page Editor</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin-nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#111}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #ddd;border-radius:7px;padding:22px;margin:14px 0}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.team{border:1px solid #ddd;padding:18px;background:#fff}.team h2{margin-top:0}.btn{display:inline-block;background:#000;color:#fff;text-decoration:none;padding:11px 15px;font-weight:800;border-radius:4px}.muted{color:#667085}</style></head><body><div class="wrap"><h1>Hustle Team Page Editor</h1><p class="muted">Choose a team. Its actual public page will open in visual edit mode, just like the HFF and Hustle homepage editors.</p><div id="teams" class="teams"><div class="card">Loading teams…</div></div></div><script>const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='admin-dashboard.html';return}const {data:a}=await sb.from('hff_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!a){location.href='admin-dashboard.html';return}const {data,error}=await sb.from('hff_teams').select('*').eq('program','rep').eq('active',true).order('season',{ascending:false}).order('team_name');const root=document.getElementById('teams');if(error){root.innerHTML='<div class="card">'+error.message+'</div>';return}root.innerHTML=(data||[]).map(t=>`<div class="team"><div class="muted">${t.season}${t.division?' · '+t.division:''}${t.gender?' · '+t.gender:''}</div><h2>${t.team_name}</h2><a class="btn" href="hustle-team.html?team=${t.id}&edit=1">Edit This Team Page</a></div>`).join('')||'<div class="card">No active Hustle teams found.</div>'})();</script></body></html>
