<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Team | My HFF</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="site-theme.css?v=20260927">
<style>
*{box-sizing:border-box}body{margin:0;background:#d7d7d7;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 70px}.back{display:inline-block;color:#111;font-weight:800;text-decoration:none;margin-bottom:22px}.hero{background:#111;color:#fff;padding:28px 30px;border-bottom:6px solid #fff}.kicker{font-size:.75rem;letter-spacing:.17em;text-transform:uppercase;font-weight:900;color:#bbb}.hero h1{color:#fff!important;margin:6px 0 4px;font-size:clamp(2rem,5vw,3.4rem);line-height:1;font-weight:900}.teamline{font-size:1.08rem;font-weight:800}.tabs{display:flex;background:#fff;border-bottom:1px solid #ccc;overflow-x:auto}.tab{border:0;background:#fff;padding:15px 18px;font-weight:900;cursor:pointer;border-bottom:4px solid transparent}.tab.active{border-color:#111}.view{display:none;padding-top:28px}.view.active{display:block}.section-title{font-size:1rem;text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin:0 0 14px}.next,.feature,.announcement,.attendance-card,.empty{background:#fff;border:1px solid #ddd;padding:20px;margin-bottom:12px}.next{border-left:6px solid #111}.next h2{margin:6px 0}.meta{color:#666;font-size:.88rem;line-height:1.5}.events{background:#fff;border-top:4px solid #111}.event{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;padding:17px 18px;border-bottom:1px solid #ddd}.event-date{font-weight:900}.event-date small{display:block;color:#666}.event-title,.roster-name{font-weight:900}.score{font-weight:900}.roster{background:#fff;border-top:4px solid #111}.roster-row,.attendance-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 16px;border-bottom:1px solid #eee}.attendance-card{border-left:6px solid #111}.attendance-summary{font-weight:900;margin:10px 0}.attendance-mark{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border:2px solid #999;border-radius:3px}.attendance-mark.attending{border-color:#188038;color:#188038}.attendance-mark.not-attending{border-color:#c5221f;color:#c5221f}.playbook-btn{display:inline-block;background:#111;color:#fff;border:0;padding:10px 14px;font-weight:900;cursor:pointer;margin-top:8px}.playbook-upload{margin-top:18px;padding-top:16px;border-top:1px solid #ddd}.playbook-upload input{display:block;margin:10px 0}.announcement h3{margin:0 0 5px}.announcement-meta{font-size:.78rem;color:#666;margin-bottom:12px}.announcement-body{white-space:pre-wrap;line-height:1.5}.status{padding:25px 0;color:#555}@media(max-width:650px){.wrap{padding:24px 14px 50px}.event{grid-template-columns:82px 1fr}.score{grid-column:2}}
</style>
</head>
<body><div id="site-nav"></div><main class="wrap"><a class="back" href="my-hff.html">← My HFF</a><div id="content" class="status">Loading team…</div></main><script src="nav.js"></script>
<script>
const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let currentUser,currentTeam;const teamId=new URLSearchParams(location.search).get('team');
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'})}function fmtTime(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}function eventName(e){return e.title||((e.event_type||'Event').charAt(0).toUpperCase()+(e.event_type||'event').slice(1))}function bindTabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active')})}
async function boot(){const{data:{user}}=await sb.auth.getUser();currentUser=user;if(!user){location.href='account.html';return}if(!teamId){$('content').textContent='Team not specified.';return}const{data:staff,error}=await sb.from('hff_team_staff').select('role,active,hff_teams(id,season,program,division,team_name,active)').eq('team_id',teamId).eq('user_id',user.id).eq('active',true).maybeSingle();if(error||!staff||!['coach','assistant_coach'].includes(staff.role)){$('content').textContent='This team is not connected to your coaching account.';return}currentTeam=staff.hff_teams;if(!currentTeam||currentTeam.active===false){$('content').textContent='This team is not currently active.';return}const[{data:links},{data:members}]=await Promise.all([sb.from('hff_event_teams').select('id,score,result,hff_events(*)').eq('team_id',teamId),sb.from('hff_team_players').select('jersey_number,active,hff_players(first_name,last_name)').eq('team_id',teamId)]);const events=(links||[]).map(x=>({...x.hff_events,link:x})).filter(e=>e&&e.published!==false).sort((a,b)=>(a.event_date||'').localeCompare(b.event_date||''));const roster=(members||[]).filter(x=>x.active!==false&&x.hff_players);const today=new Date().toISOString().slice(0,10),next=events.find(e=>(e.event_date||'')>=today);const nextHtml=next?`<div class="next"><div class="meta">Next up · ${esc(fmtDate(next.event_date))}${next.start_time?' · '+esc(fmtTime(next.start_time)):''}</div><h2>${esc(eventName(next))}</h2><div class="meta">${esc([next.location,next.field].filter(Boolean).join(' · ')||'Location to be announced')}</div></div>`:'<div class="empty">No upcoming team events are currently published.</div>';const eventHtml=events.length?`<div class="events">${events.map(e=>`<div class="event"><div class="event-date">${esc(fmtDate(e.event_date))}<small>${esc(fmtTime(e.start_time))}</small></div><div><div class="event-title">${esc(eventName(e))}</div><div class="meta">${esc([e.event_type,e.location,e.field].filter(Boolean).join(' · '))}</div></div><div class="score">${(e.event_date||'')<today&&e.link?.result?esc(e.link.result):''}</div></div>`).join('')}</div>`:'<div class="empty">No schedule has been published.</div>';const rosterHtml=roster.length?`<div class="roster">${roster.map(r=>`<div class="roster-row"><span class="roster-name">${esc(r.hff_players.first_name)} ${esc(r.hff_players.last_name||'')}</span><span>${r.jersey_number?'#'+esc(r.jersey_number):''}</span></div>`).join('')}</div>`:'<div class="empty">No active players are assigned.</div>';$('content').className='';$('content').innerHTML=`<section class="hero"><div class="kicker">${esc(currentTeam.program==='rep'?'Hanover Hustle':'Hanover Flag Football')}</div><h1>${esc(currentTeam.team_name)}</h1><div class="teamline">${[currentTeam.division,currentTeam.season].filter(Boolean).map(esc).join(' · ')}</div></section><nav class="tabs"><button class="tab active" data-view="overview">Overview</button><button class="tab" data-view="schedule">Schedule & Results</button><button class="tab" data-view="roster">Roster</button><button class="tab" data-view="playbook">Playbook</button></nav><section class="view active" id="overview"><h2 class="section-title">Next Up</h2>${nextHtml}<h2 class="section-title">Team Attendance</h2><div id="attendance"></div><h2 class="section-title">Team Announcements</h2><div id="announcements"></div></section><section class="view" id="schedule"><h2 class="section-title">Team Schedule & Results</h2>${eventHtml}</section><section class="view" id="roster"><h2 class="section-title">Team Roster</h2>${rosterHtml}</section><section class="view" id="playbook"><div class="feature"><h2>Team Playbook</h2><button class="playbook-btn" onclick="downloadPlaybook()">Download Playbook</button><div class="playbook-upload"><strong>Coach Upload</strong><div class="meta">PDF files only. Uploading a new file replaces the current playbook.</div><input id="playbookFile" type="file" accept=".pdf,application/pdf"><button class="playbook-btn" onclick="uploadPlaybook()">Upload / Replace Playbook</button><div id="playbookStatus" class="meta"></div></div></div></section>`;bindTabs();loadAttendance(events);loadAnnouncements()}
async function loadAttendance(events){const box=$('attendance'),today=new Date().toISOString().slice(0,10),open=events.filter(e=>(e.event_date||'')>=today&&e.attendance_open_date&&today>=e.attendance_open_date);if(!open.length){box.innerHTML='<div class="empty">No attendance confirmations are open right now.</div>';return}const cards=[];for(const e of open){const{data,error}=await sb.rpc('hff_team_attendance',{check_event_id:e.id,check_team_id:currentTeam.id});if(error){cards.push(`<div class="empty">Attendance could not load.</div>`);continue}const rows=data||[],g=rows.filter(r=>r.response==='going').length,n=rows.filter(r=>r.response==='not_going').length,z=rows.filter(r=>!r.response).length;cards.push(`<div class="attendance-card"><strong>${esc(eventName(e))}</strong><div class="meta">${esc(fmtDate(e.event_date))}</div><div class="attendance-summary">✓ Attending: ${g} · ✕ Can't Attend: ${n} · □ No Response: ${z}</div>${rows.map(r=>`<div class="attendance-row"><span>${esc(r.player_name)}</span><span class="attendance-mark ${r.response==='going'?'attending':r.response==='not_going'?'not-attending':''}">${r.response==='going'?'✓':r.response==='not_going'?'✕':''}</span></div>`).join('')}</div>`)}box.innerHTML=cards.join('')}
async function loadAnnouncements(){const box=$('announcements');const{data,error}=await sb.from('hff_team_announcements').select('title,body,author_name,created_at').eq('team_id',currentTeam.id).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="empty">Team announcements could not load.</div>';return}box.innerHTML=data?.length?data.map(a=>`<article class="announcement"><h3>${esc(a.title)}</h3><div class="announcement-meta">${esc(a.author_name||'Team member')} · ${esc(new Date(a.created_at).toLocaleString('en-CA',{dateStyle:'medium',timeStyle:'short'}))}</div><div class="announcement-body">${esc(a.body)}</div></article>`).join(''):'<div class="empty">No team posts yet.</div>'}
async function downloadPlaybook(){const{data:r,error}=await sb.from('hff_team_playbooks').select('file_name,storage_path').eq('team_id',currentTeam.id).maybeSingle();if(error||!r){alert('No playbook has been uploaded for this team yet.');return}const{data:file,error:fe}=await sb.storage.from('team-playbooks').download(r.storage_path);if(fe){alert('Could not download the playbook: '+fe.message);return}const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=r.file_name||'playbook.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function uploadPlaybook(){const input=$('playbookFile'),status=$('playbookStatus'),file=input?.files?.[0];if(!file){status.textContent='Choose a PDF file first.';return}if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){status.textContent='Playbooks must be PDF files.';return}status.textContent='Uploading…';const path=currentTeam.id+'/playbook.pdf';const{error:ue}=await sb.storage.from('team-playbooks').upload(path,file,{contentType:'application/pdf',upsert:true});if(ue){status.textContent='Upload failed: '+ue.message;return}const{data:ex}=await sb.from('hff_team_playbooks').select('id').eq('team_id',currentTeam.id).maybeSingle();const payload={team_id:currentTeam.id,file_name:file.name,storage_path:path,uploaded_by:currentUser.id,uploaded_at:new Date().toISOString()};const r=ex?await sb.from('hff_team_playbooks').update(payload).eq('id',ex.id):await sb.from('hff_team_playbooks').insert(payload);status.textContent=r.error?'PDF uploaded, but its record could not be saved: '+r.error.message:'Playbook uploaded successfully.';if(!r.error)input.value=''}
boot();
</script></body></html>
