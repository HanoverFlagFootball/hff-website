<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFF Product Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial;color:#111}.wrap{max-width:1250px;margin:28px auto;padding:0 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{background:#000;color:#fff;border:0;border-radius:5px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:#111;border:1px solid #bbb}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:18px}.panel{background:#fff;border:1px solid #ddd;border-radius:8px;padding:18px}label{display:block;font-size:.78rem;font-weight:800;margin:10px 0 4px}input,select,textarea{width:100%;padding:9px;border:1px solid #bbb;border-radius:4px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:7px;padding:12px;background:#fff}.card img{width:100%;height:120px;object-fit:contain;background:#f7f7f7}.muted{color:#666;font-size:.8rem}.price{font-weight:900}.actions{display:flex;gap:6px;margin-top:9px}.status{padding:10px;margin:12px 0;background:#eee;display:none}.login{position:fixed;inset:0;background:#f3f4f6;z-index:9999;display:flex;align-items:center;justify-content:center}.loginbox{width:min(420px,92vw);background:#fff;padding:24px;border:1px solid #ddd;border-radius:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.products{grid-template-columns:1fr}}</style></head><body>
<div class="login" id="login"><div class="loginbox"><h2>Product Admin</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password" style="margin-top:8px"><button class="btn" id="signin" style="width:100%;margin-top:10px">Sign In</button><p id="loginError" class="muted"></p></div></div>
<div class="wrap"><div class="top"><div><h1>Shop Products</h1><div class="muted">One product catalog for HFF, Hanover Hustle and the main shop.</div></div><div><a class="btn light" href="adminaccess.html">Order Tracking</a> <button class="btn" id="newBtn">+ New Product</button></div></div><div id="status" class="status"></div>
<div class="grid"><section class="panel"><h2 id="formTitle">Add Product</h2><input id="id" type="hidden"><label>Product Name</label><input id="name"><label>Price</label><input id="price" type="number" step="0.01"><label>Show On</label><select id="brand"><option value="hff">HFF</option><option value="hustle">Hanover Hustle</option><option value="both">Both</option></select><label>Picture</label><input id="image" placeholder="image filename or uploaded URL"><input id="imageFile" type="file" accept="image/*" style="margin-top:6px"><label>Description</label><textarea id="description" rows="3"></textarea><label>Sort Order</label><input id="sort" type="number" value="100"><label class="check"><input id="featured" type="checkbox"> Feature on matching homepage</label><label class="check"><input id="active" type="checkbox" checked> Active / visible</label><button class="btn" id="save" style="width:100%;margin-top:15px">Save Product</button></section><section><div class="products" id="products"></div></section></div></div>
<script src="admin-nav.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');let rows=[];const $=id=>document.getElementById(id);function msg(t){$('status').style.display='block';$('status').textContent=t}async function adminOK(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data}=await sb.from('hff_admins').select('user_id').eq('user_id',user.id).maybeSingle();return !!data}async function boot(){if(await adminOK()){$('login').style.display='none';load()}}$('signin').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return}if(!(await adminOK())){$('loginError').textContent='This account is not an HFF admin.';await sb.auth.signOut();return}$('login').style.display='none';load()};async function load(){const {data,error}=await sb.from('hff_products').select('*').order('sort_order').order('name');if(error)return msg(error.message);rows=data||[];render()}function render(){$('products').innerHTML=rows.map(r=>`<div class="card"><img src="${r.image_url||'Logo.jpg'}"><h3>${r.name}</h3><div class="price">$${Number(r.price).toFixed(2)}</div><div class="muted">${r.brand==='both'?'HFF + Hustle':r.brand==='hustle'?'Hanover Hustle':'HFF'} · ${r.active?'Active':'Hidden'}${r.homepage_featured?' · Homepage':''}</div><div class="actions"><button class="btn light" onclick="edit('${r.id}')">Edit</button><button class="btn light" onclick="del('${r.id}')">Delete</button></div></div>`).join('')}window.edit=id=>{const r=rows.find(x=>x.id===id);$('id').value=r.id;$('name').value=r.name;$('price').value=r.price;$('brand').value=r.brand;$('image').value=r.image_url||'';$('description').value=r.description||'';$('sort').value=r.sort_order;$('featured').checked=r.homepage_featured;$('active').checked=r.active;$('formTitle').textContent='Edit Product';scrollTo(0,0)};function clear(){['id','name','price','image','description'].forEach(x=>$(x).value='');$('brand').value='hff';$('sort').value=100;$('featured').checked=false;$('active').checked=true;$('formTitle').textContent='Add Product'}$('newBtn').onclick=clear;$('imageFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const path=`products/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;msg('Uploading picture...');const {error}=await sb.storage.from('homepage-media').upload(path,f,{upsert:true});if(error)return msg(error.message);$('image').value=sb.storage.from('homepage-media').getPublicUrl(path).data.publicUrl;msg('Picture uploaded. Save the product.')};$('save').onclick=async()=>{const payload={name:$('name').value.trim(),price:Number($('price').value||0),brand:$('brand').value,image_url:$('image').value.trim()||null,description:$('description').value.trim()||null,sort_order:Number($('sort').value||100),homepage_featured:$('featured').checked,active:$('active').checked,slug:$('name').value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};if(!payload.name)return msg('Enter a product name.');const id=$('id').value;const q=id?sb.from('hff_products').update(payload).eq('id',id):sb.from('hff_products').insert(payload);const {error}=await q;if(error)return msg(error.message);clear();msg('Product saved.');load()};window.del=async id=>{if(!confirm('Delete this product?'))return;const {error}=await sb.from('hff_products').delete().eq('id',id);if(error)return msg(error.message);load()};boot();
</script></body></html>
