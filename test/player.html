function fmtDate(s){if(!s)return'';const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'})}function fmtTime(t){if(!t)return'';const [h,m]=t.split(':').map(Number);const d=new Date(2000,0,1,h,m);return d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}function eventName(e){if(e.event_type==='game'){if(e.home_team_name&&e.away_team_name)return `${e.home_team_name} vs ${e.away_team_name}`;return e.title||'Game'}return e.title||((e.event_type||'Event').charAt(0).toUpperCase()+(e.event_type||'event').slice(1))}function scoreText(e){if(e.home_score==null&&e.away_score==null)return'';return `${e.home_score??''} – ${e.away_score??''}`}


function teamLogoFile(teamName){
  const clean=String(teamName||'')
    .replace(/\([^)]*\)/g,' ')
    .replace(/\bU\d+\b/gi,' ')
    .replace(/\s+/g,' ')
    .trim();

  const aliases={
    'arizona cardinals':'Cardinals','cardinals':'Cardinals',
    'atlanta falcons':'Falcons','falcons':'Falcons',
    'baltimore ravens':'Ravens','ravens':'Ravens',
    'buffalo bills':'Bills','bills':'Bills',
    'carolina panthers':'Panthers','panthers':'Panthers',
    'chicago bears':'Bears','bears':'Bears',
    'cincinnati bengals':'Bengals','bengals':'Bengals',
    'cleveland browns':'Browns','browns':'Browns',
    'dallas cowboys':'Cowboys','cowboys':'Cowboys',
    'denver broncos':'Broncos','broncos':'Broncos',
    'detroit lions':'Lions','lions':'Lions',
    'green bay packers':'Packers','packers':'Packers',
    'houston texans':'Texans','texans':'Texans',
    'indianapolis colts':'Colts','colts':'Colts',
    'jacksonville jaguars':'Jaguars','jaguars':'Jaguars',
    'kansas city chiefs':'Chiefs','chiefs':'Chiefs',
    'las vegas raiders':'Raiders','raiders':'Raiders',
    'los angeles chargers':'Chargers','chargers':'Chargers',
    'los angeles rams':'Rams','rams':'Rams',
    'miami dolphins':'Dolphins','dolphins':'Dolphins',
    'minnesota vikings':'Vikings','vikings':'Vikings',
    'new england patriots':'Patriots','patriots':'Patriots',
    'new orleans saints':'Saints','saints':'Saints',
    'new york giants':'Giants','giants':'Giants',
    'new york jets':'Jets','jets':'Jets',
    'philadelphia eagles':'Eagles','eagles':'Eagles',
    'pittsburgh steelers':'Steelers','steelers':'Steelers',
    'san francisco 49ers':'49ers','49ers':'49ers',
    'seattle seahawks':'Seahawks','seahawks':'Seahawks',
    'tampa bay buccaneers':'Buccaneers','buccaneers':'Buccaneers',
    'tennessee titans':'Titans','titans':'Titans',
    'washington commanders':'Commanders','commanders':'Commanders'
  };

  const key=clean.toLowerCase();
  const mascot=aliases[key] || aliases[key.split(' ').pop()];
  return mascot ? `${mascot}.png` : '';
}

function applyTeamBackground(teamName){
  document.querySelector('.team-page-bg')?.remove();
  document.querySelector('.team-page-smoke')?.remove();

  const file=teamLogoFile(teamName);
  if(!file)return;

  const bg=document.createElement('div');
  bg.className='team-page-bg';
  bg.style.backgroundImage=`url("${encodeURI(file)}")`;

  const smoke=document.createElement('div');
  smoke.className='team-page-smoke';

  document.body.prepend(smoke);
  document.body.prepend(bg);
}

async function boot(){const {data:{user}}=await sb.auth.getUser();currentUser=user;if(!user){location.href='account.html';return}if(!playerId){$('content').textContent='Player not specified.';return}const {data:guard}=await sb.from('hff_player_guardians').select('player_id').eq('user_id',user.id).eq('player_id',playerId).maybeSingle();if(!guard){$('content').textContent='This player is not connected to your account.';return}const [{data:player,error:pe},{data:members,error:me}]=await Promise.all([sb.from('hff_players').select('id,first_name,last_name').eq('id',playerId).single(),sb.from('hff_team_players').select('player_id,jersey_number,active,hff_teams(id,season,program,division,gender,team_name,active)').eq('player_id',playerId)]);if(pe||me||!player){$('content').textContent='We could not load this player.';return}const active=(members||[]).filter(x=>x.active!==false&&x.hff_teams&&x.hff_teams.active!==false);if(!active.length){$('content').innerHTML=`<div class="hero"><div class="kicker">Player</div><h1>${esc(player.first_name)} ${esc(player.last_name||'')}</h1><div class="teamline">No team assignment yet</div></div>`;return}let membership=active.find(x=>x.hff_teams.id===requestedTeam)||active[0],team=membership.hff_teams;currentTeam=team;currentPlayer=player;applyTeamBackground(team.team_name);const {data:staff}=await sb.from('hff_team_staff').select('role').eq('team_id',team.id).eq('user_id',user.id);const isCoach=(staff||[]).some(s=>s.role==='coach'||s.role==='assistant_coach');currentIsCoach=isCoach;const {data:links,error:ee}=await sb.from('hff_event_teams').select('id,side,score,result,video_url,hff_events(*)').eq('team_id',team.id);const events=ee?[]:(links||[]).map(x=>({...x.hff_events,link:x})).filter(e=>e.published!==false).sort((a,b)=>(a.event_date||'').localeCompare(b.event_date||'')||(a.start_time||'').localeCompare(b.start_time||''));const today=new Date().toISOString().slice(0,10),next=events.find(e=>(e.event_date||'')>=today);document.title=`${player.first_name} ${player.last_name||''} | My HFF`;let switches=active.length>1?`<div class="team-switch">${active.map(x=>`<a class="${x.hff_teams.id===team.id?'current':''}" href="player.html?player=${encodeURIComponent(playerId)}&team=${encodeURIComponent(x.hff_teams.id)}">${esc(x.hff_teams.team_name)}</a>`).join('')}</div>`:'';let nextHtml=next?`<div class="next"><div class="date">Next up · ${esc(fmtDate(next.event_date))}${next.start_time?' · '+esc(fmtTime(next.start_time)):''}</div><h2>${esc(eventName(next))}</h2><div class="meta">${esc([next.location,next.field].filter(Boolean).join(' · ')||'Location to be announced')}</div></div>`:`<div class="empty">No upcoming team events are currently published.</div>`;let eventHtml=events.length?`<div class="events">${events.map(e=>{const future=(e.event_date||'')>=today;return `<div class="event"><div class="event-date">${esc(fmtDate(e.event_date))}<small>${esc(fmtTime(e.start_time))}</small></div><div><div class="event-title">${esc(eventName(e))}</div><div class="event-detail">${esc([e.event_type,e.location,e.field].filter(Boolean).join(' · '))}</div></div><div class="score">${future?`<div class="schedule-attendance-wrap"><span class="schedule-attendance-label">Your Attendance</span><div class="schedule-attendance" id="schedule-attendance-${e.id}"><button class="schedule-attendance-btn attending" onclick="setAttendance('${e.id}','going')" title="Attending" aria-label="Attending">✓</button><button class="schedule-attendance-btn not-attending" onclick="setAttendance('${e.id}','not_going')" title="Can't Attend" aria-label="Can't Attend">✕</button></div></div>`:`${e.link?.result?`<span class="result">${esc(e.link.result)}</span>`:''}${esc(scoreText(e))}`}</div></div>`}).join('')}</div>`:`<div class="empty">No schedule has been published for this team yet.</div>`;

$('content').className='';$('content').innerHTML=`<section class="hero"><div class="kicker">${esc(team.program==='rep'?'Hanover Hustle':'Hanover Flag Football')}</div><h1>${esc(player.first_name)} ${esc(player.last_name||'')}</h1><div class="teamline">${esc(team.team_name)}${team.division?' · '+esc(team.division):''}${membership.jersey_number?' · #'+esc(membership.jersey_number):''}</div>${switches}</section><nav class="tabs" aria-label="Player sections"><button class="tab active" data-view="overview">Overview</button><button class="tab" data-view="schedule">Schedule & Results</button><button class="tab" data-view="playbook">Playbook</button></nav><section class="view active" id="overview"><div class="overview-block"><h2 class="section-title">Next Up</h2>${nextHtml}</div><div class="overview-block"><h2 class="section-title">Attendance</h2><div id="attendance"><div class="status">Loading attendance…</div></div></div><div class="overview-block"><h2 class="section-title">Team Announcements</h2><div id="announcementComposer"><div class="announce-form"><input id="announcementTitle" maxlength="120" placeholder="Post title"><textarea id="announcementBody" maxlength="4000" placeholder="Share something with the team..."></textarea><button onclick="postAnnouncement()">Post to Team Board</button><div id="announcementStatus" class="meta" style="margin-top:8px"></div></div></div><div id="announcements"><div class="status">Loading team announcements…</div></div></div></section><section class="view" id="schedule"><h2 class="section-title">Team Schedule & Results</h2>${eventHtml}</section><section class="view" id="playbook"><div class="feature"><h2>Team Playbook</h2><p>Players and guardians can open and download the current team playbook here.</p>${isCoach?'<p><strong>Coach account:</strong> You will be able to upload or replace the team playbook from this section.</p><span class="coming">Coach upload coming next</span>':'<p class="meta">Only a coach account can upload or replace the playbook.</p>'}</div></section>`;bindTabs();loadAttendance(events);loadScheduleAttendance(events);loadAnnouncements()}



async function loadAttendance(events){

  const box=$("attendance");if(!box||!currentTeam||!currentPlayer)return;

  const today=new Date().toISOString().slice(0,10);

  const openEvents=(events||[]).filter(e=>(e.event_date||"")>=today&&e.attendance_open_date&&today>=e.attendance_open_date);

  if(!openEvents.length){box.innerHTML='<div class="empty">No attendance confirmations are open right now.</div>';return}

  const cards=[];

  for(const e of openEvents){

    const {data,error}=await sb.rpc('hff_team_attendance',{check_event_id:e.id,check_team_id:currentTeam.id});

    if(error){cards.push(`<div class="attendance-card"><h3>${esc(eventName(e))}</h3><div class="meta">Attendance could not load: ${esc(error.message)}</div></div>`);continue}

    const rows=data||[];const mine=rows.find(r=>r.player_id===currentPlayer.id);

    const counts={going:rows.filter(r=>r.response==='going').length,not_going:rows.filter(r=>r.response==='not_going').length,no_response:rows.filter(r=>!r.response).length};

    const summary=currentIsCoach?`<div class="attendance-summary">✓ Attending: ${counts.going} · ✕ Can't Attend: ${counts.not_going} · □ No Response: ${counts.no_response}</div>`:'';

    const actions=mine?`<div class="attendance-actions"><button class="attendance-btn attending ${mine.response==='going'?'selected':''}" onclick="setAttendance('${e.id}','going')" aria-label="Attending">✓ Attending</button><button class="attendance-btn not-attending ${mine.response==='not_going'?'selected':''}" onclick="setAttendance('${e.id}','not_going')" aria-label="Can't Attend">✕ Can't Attend</button></div>`:'';

    const list=rows.map(r=>`<div class="attendance-row"><span>${esc(r.player_name)}</span><span class="attendance-status">${r.response==='going'?'<span class="attendance-mark attending" title="Attending" aria-label="Attending">✓</span>':r.response==='not_going'?'<span class="attendance-mark not-attending" title="Can’t Attend" aria-label="Can’t Attend">✕</span>':'<span class="attendance-mark no-response" title="No Response" aria-label="No Response"></span>'}</span></div>`).join('');

    cards.push(`<div class="attendance-card"><h3>${esc(eventName(e))}</h3><div class="meta">${esc(fmtDate(e.event_date))}${e.start_time?' · '+esc(fmtTime(e.start_time)):''}</div>${actions}${summary}<div class="attendance-list">${list}</div></div>`);

  }

  box.innerHTML=cards.join('');

}

async function loadScheduleAttendance(events){

  if(!currentTeam||!currentPlayer)return;

  const today=new Date().toISOString().slice(0,10);

  const future=(events||[]).filter(e=>(e.event_date||'')>=today);

  for(const e of future){

    const holder=$('schedule-attendance-'+e.id);if(!holder)continue;

    const {data,error}=await sb.rpc('hff_team_attendance',{check_event_id:e.id,check_team_id:currentTeam.id});

    if(error)continue;

    const mine=(data||[]).find(r=>r.player_id===currentPlayer.id);

    holder.querySelector('.attending')?.classList.toggle('selected',mine?.response==='going');

    holder.querySelector('.not-attending')?.classList.toggle('selected',mine?.response==='not_going');

  }

}

async function setAttendance(eventId,response){

  const {error}=await sb.rpc('hff_set_attendance',{check_event_id:eventId,check_team_id:currentTeam.id,check_player_id:currentPlayer.id,check_response:response});

  if(error){alert('Could not save attendance: '+error.message);return}

  const {data:links}=await sb.from('hff_event_teams').select('id,side,score,result,video_url,hff_events(*)').eq('team_id',currentTeam.id);

  const events=(links||[]).map(x=>({...x.hff_events,link:x})).filter(e=>e.published!==false).sort((a,b)=>(a.event_date||'').localeCompare(b.event_date||'')||(a.start_time||'').localeCompare(b.start_time||''));

  await Promise.all([loadAttendance(events),loadScheduleAttendance(events)]);

}



function boardDisplayName(first,last){

  const f=String(first||'').trim();

  const l=String(last||'').trim();

  if(!f)return 'Team member';

  return l ? `${f} ${l.charAt(0).toUpperCase()}.` : f;

}

async function authorName(){

  const {data:p}=await sb.from('hff_profiles').select('first_name,last_name').eq('user_id',currentUser.id).maybeSingle();

  if(p?.first_name)return boardDisplayName(p.first_name,p.last_name);

  const meta=currentUser.user_metadata||{};

  return boardDisplayName(meta.first_name,meta.last_name);

}

async function getTeamDisplayNames(userIds){

  const ids=[...new Set((userIds||[]).filter(Boolean))];

  const names={};

  if(!ids.length||!currentTeam)return names;

  const {data,error}=await sb.rpc('hff_team_display_names',{check_team_id:currentTeam.id,check_user_ids:ids});

  if(error)return names;

  for(const row of data||[])names[row.user_id]=row.display_name||'Team member';

  return names;

}

async function loadAnnouncements(){

  const box=$('announcements');if(!box||!currentTeam)return;

  box.innerHTML='<div class="status">Loading team announcements…</div>';

  const {data:posts,error}=await sb.from('hff_team_announcements').select('id,title,body,author_user_id,author_name,created_at').eq('team_id',currentTeam.id).order('created_at',{ascending:false});

  if(error){box.innerHTML=`<div class="empty">Team announcements could not load. ${esc(error.message)}</div>`;return}

  if(!posts?.length){box.innerHTML='<div class="empty">No team posts yet. Be the first to post.</div>';return}

  const ids=posts.map(x=>x.id);

  const {data:comments,error:ce}=await sb.from('hff_team_announcement_comments').select('id,announcement_id,body,author_user_id,author_name,created_at').in('announcement_id',ids).order('created_at',{ascending:true});

  const cs=ce?[]:(comments||[]);

  const displayNames=await getTeamDisplayNames([...posts.map(x=>x.author_user_id),...cs.map(x=>x.author_user_id)]);

  const myBoardName=await authorName();

  // Always resolve the signed-in member from their own profile. This avoids showing

  // "Team member" for their own older posts if the team-safe lookup returns no row.

  displayNames[currentUser.id]=myBoardName;

  box.innerHTML=posts.map(a=>{

    const mine=a.author_user_id===currentUser.id;

    const deletePost=(mine||currentIsCoach)?`<button class="delete-btn" onclick="deleteAnnouncement('${a.id}')">Delete</button>`:'';

    const these=cs.filter(c=>c.announcement_id===a.id);

    const legacyMine=String(a.author_name||'').trim().toLowerCase()===String(currentUser.email||'').trim().toLowerCase();

    const postName=legacyMine?myBoardName:(displayNames[a.author_user_id]||'Team member');

    return `<article class="announcement">${deletePost}<h3>${esc(a.title)}</h3><div class="announcement-meta">${esc(postName)} · ${esc(new Date(a.created_at).toLocaleString('en-CA',{dateStyle:'medium',timeStyle:'short'}))}</div><div class="announcement-body">${esc(a.body)}</div><div class="comments"><strong>Comments</strong>${these.length?these.map(c=>`<div class="comment">${(c.author_user_id===currentUser.id||currentIsCoach)?`<button class="delete-btn" onclick="deleteComment('${c.id}')">Delete</button>`:''}<strong>${esc(String(c.author_name||'').trim().toLowerCase()===String(currentUser.email||'').trim().toLowerCase()?myBoardName:(displayNames[c.author_user_id]||'Team member'))}</strong>${esc(c.body)}</div>`).join(''):'<div class="meta" style="margin-top:8px">No comments yet.</div>'}<div class="comment-form"><input id="comment-${a.id}" maxlength="1000" placeholder="Add a comment..."><button onclick="postComment('${a.id}')">Post</button></div></div></article>`

  }).join('');

}

async function postAnnouncement(){

  const title=$('announcementTitle')?.value.trim(),body=$('announcementBody')?.value.trim(),status=$('announcementStatus');

  if(!title||!body){if(status)status.textContent='Enter a title and message.';return}

  if(status)status.textContent='Posting…';

  const name=await authorName();

  const {error}=await sb.from('hff_team_announcements').insert({team_id:currentTeam.id,title,body,author_user_id:currentUser.id,author_name:name});

  if(error){if(status)status.textContent='Could not post: '+error.message;return}

  $('announcementTitle').value='';$('announcementBody').value='';if(status)status.textContent='Posted.';await loadAnnouncements();

}

async function postComment(id){

  const input=$('comment-'+id);const body=input?.value.trim();if(!body)return;

  const name=await authorName();

  const {error}=await sb.from('hff_team_announcement_comments').insert({announcement_id:id,body,author_user_id:currentUser.id,author_name:name});

  if(error){alert('Could not post comment: '+error.message);return} input.value='';await loadAnnouncements();

}

async function deleteAnnouncement(id){

  if(!confirm('Delete this team post?'))return;

  const {error}=await sb.from('hff_team_announcements').delete().eq('id',id);if(error){alert('Could not delete post: '+error.message);return}await loadAnnouncements();

}

async function deleteComment(id){

  if(!confirm('Delete this comment?'))return;

  const {error}=await sb.from('hff_team_announcement_comments').delete().eq('id',id);if(error){alert('Could not delete comment: '+error.message);return}await loadAnnouncements();

}



boot();

</script></body></html>
