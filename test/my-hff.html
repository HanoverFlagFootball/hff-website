<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My HFF | Hanover Flag Football</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="site-theme.css?v=20260927"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1040px;margin:0 auto;padding:42px 20px 70px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:20px;border-bottom:4px solid #111}.eyebrow{font-size:.76rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#666;margin-bottom:7px}.page-head h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1;font-weight:900;letter-spacing:-.04em}.accountline{font-size:.88rem;color:#666;margin-top:9px}.btn{border:2px solid #111;background:#111;color:#fff;padding:10px 16px;border-radius:4px;font-weight:800;text-decoration:none;cursor:pointer}.section-title{margin:34px 0 14px;font-size:1.15rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.player-card{display:block;background:#fff;border:1px solid #d7d7d7;border-top:5px solid #111;padding:22px;text-decoration:none;color:#111;transition:transform .15s,border-color .15s}.player-card.link:hover{transform:translateY(-2px);border-color:#111}.player-name{font-size:1.55rem;font-weight:900;letter-spacing:-.02em;margin-bottom:12px}.team-name{font-size:1rem;font-weight:800}.team-meta{color:#666;font-size:.88rem;margin-top:4px}.open{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid #e3e3e3;font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.arrow{font-size:1.35rem}.unassigned{color:#777;font-weight:700}.announcements{margin-top:34px}.announcement-panel{background:#fff;border:1px solid #d7d7d7;border-top:5px solid #111;padding:22px}.announcement-panel h3{margin:0 0 7px;font-size:1.15rem}.announcement-panel p{margin:0;color:#666;line-height:1.5}.utility{margin-top:38px;padding-top:22px;border-top:1px solid #ccc;color:#666;font-size:.9rem}.utility button{border:0;background:none;padding:0;color:#111;text-decoration:underline;font-weight:800;cursor:pointer}.request{display:none;margin-top:14px;max-width:560px}.request.opened{display:block}.request p{line-height:1.45}.request-row{display:flex;gap:8px}.request input{flex:1;min-width:0;padding:11px;border:1px solid #aaa;border-radius:4px;font-size:16px}.smallbtn{border:0;background:#111;color:#fff;padding:10px 13px;border-radius:4px;font-weight:800;cursor:pointer}.msg{font-size:.83rem;margin-top:8px}.status{margin-top:28px;padding:18px 0;color:#555}.empty{background:#fff;border:1px solid #ddd;padding:24px;margin-top:18px}@media(max-width:650px){.wrap{padding:28px 16px 55px}.page-head{align-items:flex-start;flex-direction:column}.players{grid-template-columns:1fr}.request-row{flex-direction:column}}
</style></head><body><div id="site-nav"></div><main class="wrap"><header class="page-head"><div><div class="eyebrow">Hanover Flag Football</div><h1>My HFF</h1><div class="accountline" id="accountEmail"></div></div><button class="btn" id="signOut">Sign Out</button></header><div id="content" class="status">Loading your players…</div></main><script src="nav.js"></script><script>
const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function connectAccount(user){const email=(user.email||'').trim().toLowerCase(),m=user.user_metadata||{};await sb.from('hff_profiles').upsert({user_id:user.id,email,first_name:m.first_name||null,last_name:m.last_name||null},{onConflict:'user_id'});await sb.from('hff_player_guardians').update({user_id:user.id}).is('user_id',null).ilike('guardian_email',email);await sb.from('hff_team_staff').update({user_id:user.id}).is('user_id',null).ilike('email',email)}
function requestBox(){return `<div class="utility"><span>Don't see one of your players?</span> <button type="button" id="showRequest">Request access</button><div class="request" id="requestBox"><p>Enter the guardian email address used when that player was registered. An approval request will be sent to that address.</p><div class="request-row"><input id="registrationEmail" type="email" placeholder="Registration email"><button class="smallbtn" onclick="findPlayers()">Send Request</button></div><div id="findMsg" class="msg"></div></div></div>`}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='account.html';return}$('accountEmail').textContent=user.email;await connectAccount(user);const {data:guards,error:gerr}=await sb.from('hff_player_guardians').select('player_id,hff_players(id,first_name,last_name)').eq('user_id',user.id);if(gerr){$('content').textContent='We could not load your HFF profile: '+gerr.message;return}const playerMap=new Map();for(const g of guards||[]){if(g.hff_players)playerMap.set(g.player_id,g.hff_players)}const ids=[...playerMap.keys()];let memberships=[];if(ids.length){const {data,error}=await sb.from('hff_team_players').select('player_id,jersey_number,active,hff_teams(id,season,program,division,gender,team_name,active)').in('player_id',ids);if(error){$('content').textContent='Your players were found, but teams could not be loaded: '+error.message;return}memberships=data||[]}
let html='<h2 class="section-title">Your Players</h2>';if(!ids.length){html+=`<div class="empty"><b>No players are connected to this account yet.</b><p>Use the request option below to connect a registered player.</p></div>`}else{html+='<section class="players">';for(const [id,p] of playerMap){const teams=memberships.filter(x=>x.player_id===id&&x.active!==false&&x.hff_teams&&x.hff_teams.active!==false);const primary=teams[0];const href=primary?`player.html?player=${encodeURIComponent(id)}&team=${encodeURIComponent(primary.hff_teams.id)}`:'';html+=`<${primary?'a':'div'} class="player-card ${primary?'link':''}"${primary?` href="${href}"`:''}><div class="player-name">${esc(p.first_name)} ${esc(p.last_name||'')}</div>${teams.length?teams.map(x=>`<div style="margin-top:${x===primary?'0':'10px'}"><div class="team-name">${esc(x.hff_teams.team_name)}</div><div class="team-meta">${[x.hff_teams.division,x.hff_teams.season].filter(Boolean).map(esc).join(' · ')}${x.jersey_number?' · #'+esc(x.jersey_number):''}</div></div>`).join(''):`<div class="unassigned">No team assignment yet</div>`}${primary?`<div class="open"><span>View player</span><span class="arrow">→</span></div>`:''}</${primary?'a':'div'}>`}html+='</section>'}html+=requestBox();$('content').className='';$('content').innerHTML=html;const show=$('showRequest');if(show)show.onclick=()=>{$('requestBox').classList.toggle('opened')}}
const BACKEND_URL='https://hff-server.onrender.com';async function authHeaders(){const {data:{session}}=await sb.auth.getSession();return {'Content-Type':'application/json','Authorization':'Bearer '+(session?.access_token||'')}}
window.findPlayers=async()=>{const el=$('registrationEmail'),out=$('findMsg');const email=(el?.value||'').trim().toLowerCase();if(!email){out.textContent='Enter the registration email.';return}out.textContent='Sending…';try{const r=await fetch(BACKEND_URL+'/guardian-access/request',{method:'POST',headers:await authHeaders(),body:JSON.stringify({registration_email:email})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to send request.');out.textContent='If that email is associated with an HFF family, an approval request has been sent.';el.value=''}catch(e){out.textContent=e.message}}
$('signOut').onclick=async()=>{await sb.auth.signOut();location.href='account.html'};boot();
</script></body></html>
