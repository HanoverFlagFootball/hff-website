<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My HFF | Hanover Flag Football</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="site-theme.css?v=20260927"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1040px;margin:0 auto;padding:42px 20px 70px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:20px;border-bottom:4px solid #111}.eyebrow{font-size:.76rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#666;margin-bottom:7px}.page-head h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1;font-weight:900;letter-spacing:-.04em}.accountline{font-size:.88rem;color:#666;margin-top:9px}.btn{border:2px solid #111;background:#111;color:#fff;padding:10px 16px;border-radius:4px;font-weight:800;text-decoration:none;cursor:pointer}.section-title{margin:34px 0 14px;font-size:1.15rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.player-card{display:block;background:#fff;border:1px solid #d7d7d7;border-top:5px solid #111;padding:22px;text-decoration:none;color:#111;transition:transform .15s,border-color .15s}.player-card.link:hover{transform:translateY(-2px);border-color:#111}.player-name{font-size:1.55rem;font-weight:900;letter-spacing:-.02em;margin-bottom:12px}.team-name{font-size:1rem;font-weight:800}.team-meta{color:#666;font-size:.88rem;margin-top:4px}.open{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid #e3e3e3;font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.arrow{font-size:1.35rem}.unassigned{color:#777;font-weight:700}.announcements{margin-top:34px}.announcement-panel{background:#fff;border:1px solid #d7d7d7;border-top:5px solid #111;padding:22px}.announcement-panel h3{margin:0 0 7px;font-size:1.15rem}.announcement-panel p{margin:0;color:#666;line-height:1.5}.utility{margin-top:38px;padding-top:22px;border-top:1px solid #ccc;color:#666;font-size:.9rem}.utility button{border:0;background:none;padding:0;color:#111;text-decoration:underline;font-weight:800;cursor:pointer}.request{display:none;margin-top:14px;max-width:560px}.request.opened{display:block}.request p{line-height:1.45}.request-row{display:flex;gap:8px}.request input{flex:1;min-width:0;padding:11px;border:1px solid #aaa;border-radius:4px;font-size:16px}.smallbtn{border:0;background:#111;color:#fff;padding:10px 13px;border-radius:4px;font-weight:800;cursor:pointer}.msg{font-size:.83rem;margin-top:8px}.status{margin-top:28px;padding:18px 0;color:#555}.empty{background:#fff;border:1px solid #ddd;padding:24px;margin-top:18px}@media(max-width:650px){.wrap{padding:28px 16px 55px}.page-head{align-items:flex-start;flex-direction:column}.players{grid-template-columns:1fr}.request-row{flex-direction:column}}
.season-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 4px}.season-tools select{padding:9px 12px;border:1px solid #999;background:#fff;font-size:1rem}.history-toggle{border:0;background:none;text-decoration:underline;font-weight:800;cursor:pointer;padding:9px 0;color:#111}.history-list{margin-top:12px;padding-top:10px;border-top:1px solid #ddd}.history-item{margin:7px 0;font-size:.87rem;color:#555}.former-label{font-size:.78rem;font-weight:800;color:#666;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}.player-card.former{border-top-color:#aaa}.player-card.former .player-name{font-size:1.3rem}.season-note{color:#666;font-size:.88rem;margin:6px 0 18px}
</style></head><body><div id="site-nav"></div><main class="wrap"><header class="page-head"><div><div class="eyebrow">Hanover Flag Football</div><h1>My HFF</h1><div class="accountline" id="accountEmail"></div></div><button class="btn" id="signOut">Sign Out</button></header><div id="content" class="status">Loading your players…</div></main><script src="nav.js"></script><script>
const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function connectAccount(user){const email=(user.email||'').trim().toLowerCase(),m=user.user_metadata||{};const {data:existingProfile}=await sb.from('hff_profiles').select('user_id,first_name,last_name').eq('user_id',user.id).maybeSingle();if(!existingProfile){await sb.from('hff_profiles').insert({user_id:user.id,email,first_name:m.first_name||null,last_name:m.last_name||null})}else{const profileUpdate={email};if(!existingProfile.first_name&&m.first_name)profileUpdate.first_name=m.first_name;if(!existingProfile.last_name&&m.last_name)profileUpdate.last_name=m.last_name;await sb.from('hff_profiles').update(profileUpdate).eq('user_id',user.id)}await sb.from('hff_player_guardians').update({user_id:user.id}).is('user_id',null).ilike('guardian_email',email);await sb.from('hff_team_staff').update({user_id:user.id}).is('user_id',null).ilike('email',email)}
function requestBox(){return `<div class="utility"><span>Don't see one of your players?</span> <button type="button" id="showRequest">Request access</button><div class="request" id="requestBox"><p>Enter the guardian email address used when that player was registered. An approval request will be sent to that address.</p><div class="request-row"><input id="registrationEmail" type="email" placeholder="Registration email"><button class="smallbtn" onclick="findPlayers()">Send Request</button></div><div id="findMsg" class="msg"></div></div></div>`}
let portalData=null;
function seasonTeams(teams,year){return teams.filter(x=>Number(x.hff_teams.season)===Number(year))}
function teamSummary(x){const t=x.hff_teams;return `${esc(t.team_name)} · ${[t.division,t.season,t.program].filter(Boolean).map(esc).join(' · ')}${x.jersey_number?' · #'+esc(x.jersey_number):''}`}
function renderPortal(year){
 const {playerMap,memberships,coaching,seasons}=portalData;
 const selected=Number(year);
 let html=`<div class="season-tools"><label for="seasonSelect"><b>Season</b></label><select id="seasonSelect">${seasons.map(y=>`<option value="${y}" ${y===selected?'selected':''}>${y}</option>`).join('')}</select></div><p class="season-note">Showing teams from ${selected}. Player connections and earlier team history are retained.</p>`;
 html+='<h2 class="section-title">Your Players</h2>';
 if(!playerMap.size){html+='<div class="empty"><b>No players are connected to this account yet.</b><p>Use the request option below to connect a registered player.</p></div>'}
 else{
  const players=[...playerMap.entries()].map(([id,p])=>{const all=memberships.filter(x=>x.player_id===id&&x.active!==false&&x.hff_teams&&x.hff_teams.active!==false).sort((a,b)=>Number(b.hff_teams.season)-Number(a.hff_teams.season));return {id,p,all,current:seasonTeams(all,selected)}}).sort((a,b)=>Number(Boolean(b.current.length))-Number(Boolean(a.current.length))||String(a.p.last_name).localeCompare(String(b.p.last_name)));
  html+='<section class="players">';
  for(const {id,p,all,current} of players){
   const primary=current[0];const former=!current.length;const latest=all[0];const previous=all.filter(x=>Number(x.hff_teams.season)!==selected);
   const historyId='history-'+id.replace(/[^a-zA-Z0-9_-]/g,'');
   html+=`<div class="player-card ${former?'former':''}"><div class="player-name">${esc(p.first_name)} ${esc(p.last_name||'')}</div>${former?'<div class="former-label">Not on this season’s roster</div>':''}`;
   if(current.length){for(const x of current){html+=`<div style="margin-top:10px"><div class="team-name">${esc(x.hff_teams.team_name)}</div><div class="team-meta">${[x.hff_teams.division,x.hff_teams.season].filter(Boolean).map(esc).join(' · ')}${x.jersey_number?' · #'+esc(x.jersey_number):''}</div><a class="history-toggle" href="player.html?player=${encodeURIComponent(id)}&team=${encodeURIComponent(x.hff_teams.id)}">View player →</a></div>`}}
   else if(latest){html+=`<div class="team-meta">Last played ${esc(latest.hff_teams.season)} · ${esc(latest.hff_teams.team_name)} · ${esc(latest.hff_teams.division||'')}</div>`}
   else{html+='<div class="unassigned">No team assignment yet</div>'}
   if(previous.length){html+=`<button class="history-toggle" type="button" data-history="${historyId}" aria-expanded="false">View previous teams (${previous.length})</button><div class="history-list" id="${historyId}" hidden>${previous.map(x=>`<div class="history-item">${teamSummary(x)} — <a href="player.html?player=${encodeURIComponent(id)}&team=${encodeURIComponent(x.hff_teams.id)}">View</a></div>`).join('')}</div>`}
   html+='</div>';
  }
  html+='</section>';
 }
 const currentCoaches=coaching.filter(x=>Number(x.hff_teams.season)===selected);
 const oldCoaches=coaching.filter(x=>Number(x.hff_teams.season)!==selected);
 if(coaching.length){html+='<h2 class="section-title">Coaching</h2>';if(currentCoaches.length){html+='<section class="players">';for(const c of currentCoaches){const t=c.hff_teams;html+=`<a class="player-card link" href="team.html?team=${encodeURIComponent(t.id)}"><div class="player-name">${esc(t.team_name)}</div><div class="team-name">${esc(c.role==='assistant_coach'?'Assistant Coach':'Coach')}</div><div class="team-meta">${[t.division,t.season].filter(Boolean).map(esc).join(' · ')}</div><div class="open"><span>View team</span><span class="arrow">→</span></div></a>`}html+='</section>'}else{html+='<p class="season-note">No coaching assignments for this season.</p>'}if(oldCoaches.length){html+=`<button class="history-toggle" type="button" data-history="coachHistory" aria-expanded="false">View previous coaching assignments (${oldCoaches.length})</button><div class="history-list" id="coachHistory" hidden>${oldCoaches.map(c=>`<div class="history-item">${esc(c.hff_teams.season)} · ${esc(c.hff_teams.team_name)} · ${esc(c.hff_teams.division||'')} · ${esc(c.role)} — <a href="team.html?team=${encodeURIComponent(c.hff_teams.id)}">View team</a></div>`).join('')}</div>`}}
 html+=requestBox();$('content').className='';$('content').innerHTML=html;
 $('seasonSelect').onchange=e=>renderPortal(e.target.value);
 $('showRequest').onclick=()=>$('requestBox').classList.toggle('opened');
 document.querySelectorAll('[data-history]').forEach(btn=>btn.onclick=()=>{const el=$(btn.dataset.history);el.hidden=!el.hidden;btn.setAttribute('aria-expanded',String(!el.hidden));btn.textContent=(el.hidden?'View':'Hide')+btn.textContent.replace(/^(View|Hide)/,'')});
}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='account.html';return}$('accountEmail').textContent=user.email;await connectAccount(user);
 const {data:guards,error:gerr}=await sb.from('hff_player_guardians').select('player_id,hff_players(id,first_name,last_name)').eq('user_id',user.id);
 if(gerr){$('content').textContent='We could not load your HFF profile: '+gerr.message;return}
 const playerMap=new Map();for(const g of guards||[]){if(g.hff_players)playerMap.set(g.player_id,g.hff_players)}
 const ids=[...playerMap.keys()];let memberships=[];
 if(ids.length){const {data,error}=await sb.from('hff_team_players').select('player_id,jersey_number,active,hff_teams(id,season,program,division,gender,team_name,active)').in('player_id',ids);if(error){$('content').textContent='Your players were found, but teams could not be loaded: '+error.message;return}memberships=data||[]}
 const {data:staffRows,error:serr}=await sb.from('hff_team_staff').select('team_id,role,active').eq('user_id',user.id).eq('active',true);
 if(serr){$('content').textContent='Your players were found, but coaching assignments could not be loaded: '+serr.message;return}
 const coachStaff=(staffRows||[]).filter(x=>x.role==='coach'||x.role==='assistant_coach');let coaching=[];
 if(coachStaff.length){const coachTeamIds=[...new Set(coachStaff.map(x=>x.team_id).filter(Boolean))];const {data:coachTeams,error:terr}=await sb.from('hff_teams').select('id,season,program,division,gender,team_name,active').in('id',coachTeamIds);if(terr){$('content').textContent='Your coaching assignments were found, but the teams could not be loaded: '+terr.message;return}const teamById=new Map((coachTeams||[]).map(t=>[t.id,t]));coaching=coachStaff.map(s=>({...s,hff_teams:teamById.get(s.team_id)})).filter(x=>x.hff_teams&&x.hff_teams.active!==false)}
 const years=[...memberships.map(x=>x.hff_teams?.season),...coaching.map(x=>x.hff_teams?.season)].filter(x=>Number.isInteger(Number(x))&&Number(x)>2000).map(Number);
 const currentYear=new Date().getFullYear();const seasons=[...new Set([...years,currentYear])].sort((a,b)=>b-a);
 portalData={playerMap,memberships,coaching,seasons};renderPortal(seasons[0]);
}
const BACKEND_URL='https://hff-server.onrender.com';async function authHeaders(){const {data:{session}}=await sb.auth.getSession();return {'Content-Type':'application/json','Authorization':'Bearer '+(session?.access_token||'')}}
window.findPlayers=async()=>{const el=$('registrationEmail'),out=$('findMsg');const email=(el?.value||'').trim().toLowerCase();if(!email){out.textContent='Enter the registration email.';return}out.textContent='Sending…';try{const r=await fetch(BACKEND_URL+'/guardian-access/request',{method:'POST',headers:await authHeaders(),body:JSON.stringify({registration_email:email})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to send request.');out.textContent='If that email is associated with an HFF family, an approval request has been sent.';el.value=''}catch(e){out.textContent=e.message}}
$('signOut').onclick=async()=>{await sb.auth.signOut();location.href='account.html'};boot();
</script></body></html>
