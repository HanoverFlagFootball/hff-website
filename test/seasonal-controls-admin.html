<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seasonal Controls | HFF Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin-nav.js"></script><style>body{margin:0;background:#f4f5f7;font-family:Arial;color:#111827}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #d9dee7;border-radius:9px;padding:20px;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:20px}.row h2{margin:0 0 5px;font-size:1.1rem}.row p{margin:0;color:#667085}.switch{position:relative;width:64px;height:34px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#bbb;border-radius:30px;cursor:pointer}.slider:before{content:"";position:absolute;width:26px;height:26px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#16803c}.switch input:checked+.slider:before{transform:translateX(30px)}.status{padding:12px 0;color:#667085}.back{color:#111;font-weight:700}</style></head><body><div class="wrap"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><h1>Seasonal Controls</h1><p>These switches control the live website. Changes take effect across all entry points.</p><div id="controls"></div><div id="status" class="status">Checking admin access…</div></div><script>
const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');
const defs=[['hff_registration_open','HFF Registration','House League registration pages'],['shop_open','League Shop','Shop, Add to Cart, Cart and shop checkout']];
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='admin-dashboard.html';return}const {data:admin}=await sb.from('hff_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!admin){document.getElementById('status').textContent='Administrator access required.';return}const {data,error}=await sb.from('hff_site_settings').select('*');if(error){document.getElementById('status').textContent=error.message;return}const map=Object.fromEntries((data||[]).map(x=>[x.setting_key,x.enabled]));document.getElementById('controls').innerHTML=defs.map(([k,t,d])=>`<div class="card"><div class="row"><div><h2>${t}</h2><p>${d}</p></div><label class="switch"><input type="checkbox" data-key="${k}" ${map[k]?'checked':''}><span class="slider"></span></label></div></div>`).join('');document.getElementById('status').textContent='Green = open. Grey = closed.';document.querySelectorAll('input[data-key]').forEach(el=>el.onchange=async()=>{el.disabled=true;document.getElementById('status').textContent='Saving…';const {error}=await sb.from('hff_site_settings').update({enabled:el.checked,updated_at:new Date().toISOString(),updated_by:session.user.id}).eq('setting_key',el.dataset.key);if(error){el.checked=!el.checked;document.getElementById('status').textContent='Could not save: '+error.message}else document.getElementById('status').textContent='Saved.';el.disabled=false;});})();
</script></body></html>
