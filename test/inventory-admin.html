<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFF Inventory Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin-nav.js"></script>
<style>:root{--line:#d9dee7;--page:#f4f5f7;--muted:#667085;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--page);font-family:Arial,Helvetica,sans-serif;color:#111827}.wrap{max-width:1350px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.head h1{margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}.card h2{margin:0 0 14px;border-bottom:3px solid #000;padding-bottom:9px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-size:.76rem;font-weight:800;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd2dc;border-radius:5px;background:#fff;font:inherit}textarea{min-height:72px;resize:vertical}.btn{border:0;border-radius:5px;padding:10px 13px;font-weight:800;cursor:pointer;background:#000;color:#fff}.light{background:#e9edf2;color:#111}.danger{background:#b42318}.small,.status{font-size:.82rem;color:var(--muted)}.hidden{display:none!important}.login{max-width:460px;margin:55px auto}.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin-bottom:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:9px 7px;border-bottom:1px solid #e6e9ee;text-align:left;vertical-align:top}th{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;background:#f8f9fb;position:sticky;top:0}.qty{width:76px;font-weight:800}.edit{min-width:95px}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:850px){.wrap{padding:14px}.grid,.filters{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}@media(max-width:520px){.grid,.filters{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="wrap login"><div class="card"><h2>Inventory Admin Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="btn" id="loginBtn">Sign In</button><div class="status" id="loginStatus"></div></div></div>
<div id="app" class="wrap hidden"><div class="head"><div><h1>Inventory</h1><div class="small">Physical items HFF actually has on hand. Normal Shop orders do not change these quantities.</div></div><button class="btn light" id="logoutBtn">Sign Out</button></div>
<section class="card"><h2>Add Inventory Item</h2><div class="grid"><div><label>Item</label><input id="itemName" placeholder="e.g. Jersey or Black HFF Hat"></div><div><label>Category</label><select id="category"><option>Jersey</option><option>Hat</option><option>Shirt</option><option>Equipment</option><option>Other</option></select></div><div><label>Season</label><input id="season" type="number" placeholder="e.g. 2027"></div><div><label>Program</label><select id="program"><option value="">Not specific</option><option value="house">House League</option><option value="rep">Hanover Hustle / Rep</option></select></div><div><label>Team</label><select id="team"><option value="">No specific team</option></select></div><div><label>Size / Variant</label><input id="size" placeholder="e.g. Youth L, Adult"></div><div><label>Quantity On Hand</label><input id="quantity" type="number" min="0" value="1"></div><div><label>Location</label><input id="location" placeholder="e.g. Jersey Bin"></div><div class="full"><label>Notes</label><textarea id="notes" placeholder="e.g. Misordered 2026; save for next season"></textarea></div><div class="full"><button class="btn" id="addBtn">Add Inventory Item</button> <span class="status" id="addStatus"></span></div></div></section>
<section class="card"><h2>All Inventory</h2><div class="filters"><input id="search" placeholder="Search item, notes, location…"><select id="fCategory"><option value="">All Categories</option><option>Jersey</option><option>Hat</option><option>Shirt</option><option>Equipment</option><option>Other</option></select><select id="fProgram"><option value="">All Programs</option><option value="house">House League</option><option value="rep">Hanover Hustle / Rep</option><option value="none">Not specific</option></select><select id="fTeam"><option value="">All Teams</option></select><select id="fSeason"><option value="">All Seasons</option></select><input id="fSize" placeholder="Size / Variant"></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Category</th><th>Season</th><th>Program</th><th>Team</th><th>Size / Variant</th><th>Qty</th><th>Location</th><th>Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="status" id="tableStatus"></div></section></div>
<script>
const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let teams=[],items=[];
async function isAdmin(s){if(!s)return false;const {data}=await sb.from('hff_admins').select('user_id').eq('user_id',s.user.id).maybeSingle();return !!data}
async function show(s){if(!(await isAdmin(s))){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadTeams();await loadItems()}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=error?error.message:''};$('logoutBtn').onclick=()=>sb.auth.signOut();
async function loadTeams(){const {data}=await sb.from('hff_teams').select('id,season,program,team_name,division').order('season',{ascending:false}).order('team_name');teams=data||[];const opts=teams.map(t=>`<option value="${t.id}">${esc(t.team_name)}${t.division?' ('+esc(t.division)+')':''} — ${t.season}</option>`).join('');$('team').innerHTML='<option value="">No specific team</option>'+opts;$('fTeam').innerHTML='<option value="">All Teams</option>'+opts}
$('addBtn').onclick=async()=>{const name=$('itemName').value.trim();if(!name){$('addStatus').textContent='Enter an item name.';return}const payload={item_name:name,category:$('category').value,season:$('season').value?+$('season').value:null,program:$('program').value||null,team_id:$('team').value||null,size_variant:$('size').value.trim()||null,quantity:Math.max(0,+$('quantity').value||0),location:$('location').value.trim()||null,notes:$('notes').value.trim()||null,updated_at:new Date().toISOString()};$('addStatus').textContent='Saving…';const {error}=await sb.from('hff_inventory').insert(payload);if(error){$('addStatus').textContent=error.message;return}$('addStatus').textContent='Inventory item added.';['itemName','season','size','location','notes'].forEach(id=>$(id).value='');$('quantity').value=1;$('team').value='';await loadItems()};
async function loadItems(){const {data,error}=await sb.from('hff_inventory').select('*').order('item_name');if(error){$('tableStatus').textContent=error.message;return}items=data||[];const seasons=[...new Set(items.map(x=>x.season).filter(Boolean))].sort((a,b)=>b-a);$('fSeason').innerHTML='<option value="">All Seasons</option>'+seasons.map(x=>`<option>${x}</option>`).join('');render()}
function teamName(id){const t=teams.find(x=>x.id===id);return t?(t.team_name+(t.division?' ('+t.division+')':'')):''}function programName(p){return p==='house'?'House':p==='rep'?'Hustle':'—'}
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('fCategory').value,prog=$('fProgram').value,team=$('fTeam').value,season=$('fSeason').value,size=$('fSize').value.trim().toLowerCase();const list=items.filter(x=>(!q||[x.item_name,x.notes,x.location,teamName(x.team_id)].join(' ').toLowerCase().includes(q))&&(!cat||x.category===cat)&&(!prog||(prog==='none'?!x.program:x.program===prog))&&(!team||x.team_id===team)&&(!season||String(x.season)===season)&&(!size||String(x.size_variant||'').toLowerCase().includes(size)));$('rows').innerHTML=list.length?list.map(x=>`<tr><td><input class="edit" id="n-${x.id}" value="${esc(x.item_name)}"></td><td><select id="c-${x.id}">${['Jersey','Hat','Shirt','Equipment','Other'].map(v=>`<option ${x.category===v?'selected':''}>${v}</option>`).join('')}</select></td><td><input class="edit" id="y-${x.id}" type="number" value="${x.season??''}"></td><td><select id="p-${x.id}"><option value="" ${!x.program?'selected':''}>—</option><option value="house" ${x.program==='house'?'selected':''}>House</option><option value="rep" ${x.program==='rep'?'selected':''}>Hustle</option></select></td><td><select id="t-${x.id}"><option value="">—</option>${teams.map(t=>`<option value="${t.id}" ${x.team_id===t.id?'selected':''}>${esc(t.team_name)}${t.division?' ('+esc(t.division)+')':''}</option>`).join('')}</select></td><td><input class="edit" id="s-${x.id}" value="${esc(x.size_variant||'')}"></td><td><input class="qty" id="q-${x.id}" type="number" min="0" value="${x.quantity}"></td><td><input class="edit" id="l-${x.id}" value="${esc(x.location||'')}"></td><td><input class="edit" id="o-${x.id}" value="${esc(x.notes||'')}"></td><td><button class="btn" onclick="saveRow('${x.id}')">Save</button> <button class="btn danger" onclick="delRow('${x.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="10" class="empty">No inventory matches these filters.</td></tr>`;$('tableStatus').textContent=`${list.length} item${list.length===1?'':'s'} shown.`}
window.saveRow=async id=>{const payload={item_name:$('n-'+id).value.trim(),category:$('c-'+id).value,season:$('y-'+id).value?+$('y-'+id).value:null,program:$('p-'+id).value||null,team_id:$('t-'+id).value||null,size_variant:$('s-'+id).value.trim()||null,quantity:Math.max(0,+$('q-'+id).value||0),location:$('l-'+id).value.trim()||null,notes:$('o-'+id).value.trim()||null,updated_at:new Date().toISOString()};const {error}=await sb.from('hff_inventory').update(payload).eq('id',id);$('tableStatus').textContent=error?error.message:'Inventory updated.';if(!error)await loadItems()};window.delRow=async id=>{if(!confirm('Delete this inventory item?'))return;const {error}=await sb.from('hff_inventory').delete().eq('id',id);$('tableStatus').textContent=error?error.message:'Inventory item deleted.';if(!error)await loadItems()};['search','fCategory','fProgram','fTeam','fSeason','fSize'].forEach(id=>$(id).addEventListener(id==='search'||id==='fSize'?'input':'change',render));sb.auth.onAuthStateChange((_e,s)=>show(s));sb.auth.getSession().then(({data})=>show(data.session));
</script></body></html>
