<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Guardian Access | Hanover Flag Football</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="site-theme.css?v=20260927"><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:42px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:28px}.btn{display:inline-block;border:0;background:#111;color:#fff;padding:12px 18px;border-radius:5px;font-weight:800;text-decoration:none;cursor:pointer}.muted{color:#666;line-height:1.5}.status{margin-top:18px;padding:12px;background:#f5f5f5;border-radius:6px}</style></head><body><div id="site-nav"></div><main class="wrap"><section class="card"><h1>Guardian Access</h1><div id="content" class="status">Checking this request…</div></section></main><script src="nav.js"></script><script>
const BACKEND='https://hff-server.onrender.com';const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');const token=new URLSearchParams(location.search).get('token')||'';let details=null;
async function load(){const out=document.getElementById('content');try{const r=await fetch(BACKEND+'/guardian-access/details?token='+encodeURIComponent(token));const j=await r.json();if(!r.ok)throw new Error(j.error);details=j;if(j.request_type==='invite'){const {data:{user}}=await sb.auth.getUser();if(!user||String(user.email).toLowerCase()!==String(j.target_email).toLowerCase()){out.innerHTML=`<p>This invitation was sent to <b>${j.target_email}</b>.</p><p class="muted">Sign in or create an HFF account using that email address, then return to this approval link.</p><a class="btn" href="account.html">Sign In / Create Account</a>`;return}}out.innerHTML=`<p><b>${j.requester_name}</b> (${j.requester_email}) is requesting guardian access.</p><p class="muted">Approving gives this person access to the same HFF player record, team information and future My HFF features. It does not create a duplicate player.</p><button class="btn" id="approve">Approve Access</button>`;document.getElementById('approve').onclick=approve}catch(e){out.textContent=e.message||'This request is invalid or expired.'}}
async function approve(){const out=document.getElementById('content');let headers={'Content-Type':'application/json'};const {data:{session}}=await sb.auth.getSession();if(session)headers.Authorization='Bearer '+session.access_token;const r=await fetch(BACKEND+'/guardian-access/approve',{method:'POST',headers,body:JSON.stringify({token})});const j=await r.json();if(!r.ok){out.textContent=j.error||'Unable to approve access.';return}out.innerHTML='<h2>Access approved</h2><p>The guardian now has access to the connected HFF player(s).</p>'}load();
</script></body></html>
