<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanover Hustle | Team</title><link rel="stylesheet" href="nav.css"><link rel="stylesheet" href="site-theme.css?v=20260913"><link rel="stylesheet" href="visual-editor.css?v=2"><style>:root{--accent:#d5ad2e}*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111;font-family:Arial,sans-serif}.motto{background:#e7e7e7;color:#111;text-align:center;padding:13px;font:italic bold clamp(1.1rem,3vw,1.7rem) Impact,"Arial Narrow",sans-serif;letter-spacing:.06em}main{max-width:1180px;margin:auto;padding:20px}.hero{height:clamp(230px,38vw,450px);background:center 38%/cover;border-bottom:5px solid var(--accent)}.team-title{font:clamp(2rem,5vw,3.5rem) Impact,"Arial Narrow",sans-serif;margin:16px 0 8px}.register{display:inline-block;background:#111;color:white;text-decoration:none;padding:13px 28px;border-bottom:4px solid var(--accent);font-weight:900}.layout{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(230px,1fr);gap:22px;margin-top:22px}.card{background:white;border:1px solid #d9dee7;padding:22px;margin-bottom:20px}h2{margin:0 0 15px;border-bottom:3px solid var(--accent);padding-bottom:10px}p{line-height:1.55}.calendar-link{display:inline-block;padding:12px 17px;background:#111;color:white;text-decoration:none;font-weight:bold}.muted{color:#555}.date{padding:10px 0;border-bottom:1px solid #eee}.date strong{display:block}.game{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #eee;align-items:center}.game a{color:#111;font-weight:bold}.hidden{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}.game{grid-template-columns:1fr}}.team-edit-add{min-height:70px}.team-edit-date{position:relative}.team-edit-date input{width:100%;padding:6px;margin:4px 0;border:1px dashed #777}.team-edit-link{position:relative}.team-edit-pencil{margin-left:8px;border:0;background:#fff;color:#000;border-radius:50%;width:28px;height:28px;font-weight:900;cursor:pointer}.team-edit-remove{position:absolute;right:0;top:5px;border:0;background:#111;color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer}.reg-control{display:flex;align-items:center;gap:10px;margin:10px 0 14px;padding:10px 12px;border:1px dashed #777;background:#fff}.reg-control input{width:20px;height:20px}.register.closed{opacity:.55;pointer-events:none}.reg-note{font-weight:700;color:#666;margin-left:8px}</style></head><body><header class="site-header"><div id="site-nav"></div></header><div class="motto">BUILT TO COMPETE ✦ UNITED BY THE HUSTLE</div><main id="main"><p>Loading team…</p></main><script src="nav.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://wnhzgxnwlmohfldnhhyt.supabase.co',K='sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY',sb=supabase.createClient(U,K),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search),id=qs.get('team'),edit=qs.get('edit')==='1';let team,page={},dates=[],dirty=false,currentEvents=[];
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function status(s){const e=document.getElementById('veStatus');if(e)e.textContent=s}
async function adminOK(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;const {data}=await sb.from('hff_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();return !!data}
async function upload(file){const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'');const path=`team-pages/${id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const {error}=await sb.storage.from('homepage-media').upload(path,file);if(error)throw error;return sb.storage.from('homepage-media').getPublicUrl(path).data.publicUrl}
function pick(cb,accept='image/*'){const i=document.createElement('input');i.type='file';i.accept=accept;i.style.display='none';document.body.appendChild(i);i.onchange=async()=>{if(i.files[0])await cb(i.files[0]);i.remove()};i.click()}
async function uploadCalendar(){pick(async f=>{try{status('Uploading calendar…');page.calendar_url=await upload(f);page.calendar_label='DOWNLOAD PRINTABLE CALENDAR →';render(currentEvents);enableEditor();markDirty()}catch(err){status(err.message)}},'.pdf,.doc,.docx,image/*')}
async function editVideo(eventTeamId,current){const next=prompt('Highlight video link (leave blank to remove):',current||'');if(next===null)return;status('Saving highlight link…');const {error}=await sb.from('hff_event_teams').update({video_url:next.trim()||null}).eq('id',eventTeamId);if(error){status(error.message);return}const ev=currentEvents.find(e=>e.link.id===eventTeamId);if(ev)ev.link.video_url=next.trim()||null;render(currentEvents);enableEditor();status('Highlight link saved')}
async function save(){status('Saving…');const row={team_id:id,hero_url:page.hero_url||null,intro_text:document.getElementById('introText').textContent.trim(),eligibility_text:document.getElementById('eligibilityText').textContent.trim(),commitment_text:document.getElementById('commitmentText').textContent.trim(),funding_text:document.getElementById('fundingText').textContent.trim(),registration_label:page.registration_label||'REGISTER / REGISTRATION INFORMATION →',registration_url:page.registration_url||'rep.html',calendar_label:page.calendar_label||'VIEW / PRINT CALENDAR →',calendar_url:page.calendar_url||null,registration_open:!!page.registration_open,important_dates:dates,updated_at:new Date().toISOString()};const {error}=await sb.from('hff_team_pages').upsert(row);if(error){status(error.message);return}page={...page,...row};dirty=false;status('Changes saved and published')}
function markDirty(){dirty=true;status('Unsaved changes')}
function editLink(which){const isReg=which==='reg',label=document.getElementById('regBtn').childNodes[0].textContent.trim(),url=page.registration_url||'rep.html';if(!isReg)return;const newLabel=prompt('Button text:',label);if(newLabel===null)return;const newUrl=prompt('Link:',url);if(newUrl===null)return;page.registration_url=newUrl;page.registration_label=newLabel;document.getElementById('regBtn').childNodes[0].textContent=(page.registration_open?newLabel:'REGISTRATION CLOSED')+' ';markDirty()}
function toolbar(){document.body.insertAdjacentHTML('afterbegin',`<div class="ve-toolbar"><strong>HUSTLE TEAM PAGE EDITOR</strong><span class="ve-help">Click text to edit · + replaces/adds · × removes</span><span class="spacer"></span><span class="ve-status" id="veStatus">Editing ${esc(team.team_name)}</span><button class="ve-btn" onclick="location.href='hustle-team-admin.html'">Choose Team</button><button class="ve-btn" onclick="window.open('hustle-team.html?team=${id}','_blank')">View Live Page</button><button class="ve-btn primary" id="saveTeam">Save Changes</button><button class="ve-btn" onclick="location.href='admin-dashboard.html'">Dashboard</button></div>`);document.getElementById('saveTeam').onclick=save}
function renderDates(){const root=document.getElementById('datesBox');root.innerHTML=dates.length?dates.map((d,i)=>`<div class="date team-edit-date"><button class="team-edit-remove" data-remove="${i}">×</button><input data-date-i="${i}" data-k="title" value="${esc(d.title||'')}" placeholder="Title"><input data-date-i="${i}" data-k="date" value="${esc(d.date||'')}" placeholder="Date"><input data-date-i="${i}" data-k="details" value="${esc(d.details||'')}" placeholder="Details"></div>`).join(''):'';root.insertAdjacentHTML('beforeend','<button class="ve-add ve-add-button team-edit-add" id="addTeamDate"><div>+<small>Add important date</small></div></button>');root.querySelectorAll('input').forEach(x=>x.oninput=()=>{dates[+x.dataset.dateI][x.dataset.k]=x.value;markDirty()});root.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{dates.splice(+x.dataset.remove,1);renderDates();markDirty()});document.getElementById('addTeamDate').onclick=()=>{dates.push({title:'New Important Date',date:'',details:'Click to add details'});renderDates();markDirty()}}
function enableEditor(){if(document.getElementById('veStatus'))return;toolbar();const regControl=document.getElementById('regControl');if(regControl){regControl.classList.remove('hidden');const toggle=document.getElementById('teamRegOpen');toggle.checked=!!page.registration_open;toggle.onchange=()=>{page.registration_open=toggle.checked;render(currentEvents);enableEditor();markDirty()}}['introText','eligibilityText','commitmentText','fundingText'].forEach(x=>{const e=document.getElementById(x);e.contentEditable='true';e.classList.add('ve-edit');e.oninput=markDirty});const hero=document.getElementById('teamHero');hero.classList.add('ve-media');hero.insertAdjacentHTML('beforeend','<div class="ve-media-controls"><button class="ve-icon" id="replaceHero" title="Replace">+</button><button class="ve-icon" id="removeHero" title="Remove">×</button></div>');document.getElementById('replaceHero').onclick=e=>{e.preventDefault();pick(async f=>{try{status('Uploading hero…');page.hero_url=await upload(f);hero.style.backgroundImage=`url('${page.hero_url}')`;markDirty()}catch(err){status(err.message)}})};document.getElementById('removeHero').onclick=e=>{e.preventDefault();page.hero_url='';hero.style.backgroundImage='none';markDirty()};const reg=document.getElementById('regBtn');reg.insertAdjacentHTML('beforeend','<button class="team-edit-pencil" type="button">✎</button>');reg.querySelector('button').onclick=e=>{e.preventDefault();e.stopPropagation();editLink('reg')};const cal=document.getElementById('calendarArea');if(cal){cal.classList.remove('hidden');cal.insertAdjacentHTML('beforeend',`<button class="ve-add ve-add-button team-edit-add" id="uploadCalendar"><div>+<small>${page.calendar_url?'Replace printable calendar':'Upload printable calendar'}</small></div></button>${page.calendar_url?'<button class="ve-btn" id="removeCalendar" type="button">Remove Calendar</button>':''}`);document.getElementById('uploadCalendar').onclick=uploadCalendar;const r=document.getElementById('removeCalendar');if(r)r.onclick=()=>{page.calendar_url='';render(currentEvents);enableEditor();markDirty()}}document.querySelectorAll('[data-video-edit]').forEach(b=>b.onclick=()=>editVideo(b.dataset.videoEdit,b.dataset.current||''));renderDates()}
function render(events=[]){currentEvents=events;const hero=page.hero_url||'',intro=page.intro_text||`Learn what it takes to represent Hanover Hustle ${team.team_name}.`,elig=page.eligibility_text||'Coming soon.',commit=page.commitment_text||'Coming soon.',fund=page.funding_text||'Coming soon.';document.getElementById('main').innerHTML=`<div id="teamHero" class="hero" style="${hero?`background-image:url('${esc(hero)}')`:'background-image:none'}" role="img" aria-label="${esc(team.team_name)}"></div><h1 class="team-title">HANOVER HUSTLE · ${esc(team.team_name).toUpperCase()}</h1><div id="regControl" class="reg-control ${edit?'':'hidden'}"><label><input id="teamRegOpen" type="checkbox" ${page.registration_open?'checked':''}> <strong>Registration Open for this team</strong></label></div><a id="regBtn" class="register ${page.registration_open?'':'closed'}" href="${page.registration_open?esc((page.registration_url||'RepRegister.html')+((page.registration_url||'RepRegister.html').includes('?')?'&':'?')+'team='+id):'#'}">${esc(page.registration_open?(page.registration_label||'REGISTER / REGISTRATION INFORMATION →'):'REGISTRATION CLOSED')}</a>${!page.registration_open&&!edit?'<span class="reg-note">Registration is currently closed for this team.</span>':''}<div class="layout"><div><section class="card"><h2>ABOUT THE TEAM</h2><p id="introText">${esc(intro)}</p><p><strong>Eligibility &amp; birth years:</strong> <span id="eligibilityText">${esc(elig)}</span></p><p><strong>Commitment &amp; expectations:</strong> <span id="commitmentText">${esc(commit)}</span></p><p><strong>Funding supports:</strong> <span id="fundingText">${esc(fund)}</span></p><a href="${edit?'rep-admin.html':'rep-home.html'}">← Hanover Hustle homepage</a></section><section class="card ${!page.calendar_url&&!edit?'hidden':''}" id="calendarArea"><h2>TEAM CALENDAR</h2>${page.calendar_url?`<a class="calendar-link" href="${esc(page.calendar_url)}" download>DOWNLOAD PRINTABLE CALENDAR →</a>`:''}</section><section class="card"><h2>${edit?`<a href="schedule-admin.html?program=rep&team=${encodeURIComponent(id)}&season=${encodeURIComponent(team.season)}" style="color:inherit;text-decoration:none">SCHEDULE <span style="font-size:.55em">EDIT →</span></a>`:'SCHEDULE'}</h2><div id="results">${events.length?events.map(e=>{const typ=String(e.event_type||'').toLowerCase();const opponent=e.link.side==='home'?e.away_team_name:e.link.side==='away'?e.home_team_name:'';const label=typ==='practice'?'Practice':(opponent?`vs ${opponent}`:(e.title||e.event_type||'Event'));const score=e.link.score!==null&&e.link.score!==undefined&&e.link.score!==''?` · ${esc(e.link.result||'')} ${esc(e.link.score)}`:'';const publicLink=e.link.video_url?`<a href="${esc(e.link.video_url)}">Highlights →</a>`:'';const editBtn=edit?`<button class="team-edit-pencil" type="button" data-video-edit="${esc(e.link.id)}" data-current="${esc(e.link.video_url||'')}" title="Edit highlight video link">✎</button>`:'';return `<div class="game"><strong>${esc(fmtDate(e.event_date))}</strong><span>${esc(label)}${score}</span><span>${publicLink}${editBtn}</span></div>`}).join(''):'<p class="muted">Coming soon.</p>'}</div></section></div><aside><section class="card"><h2>IMPORTANT DATES</h2><div id="datesBox">${dates.length?dates.map(d=>`<div class="date"><strong>${esc(d.title||'')}</strong><span>${esc(d.date||'')}${d.details?' · '+esc(d.details):''}</span></div>`).join(''):'<p class="muted">Team-specific deadlines and key dates will be posted when confirmed.</p>'}</div></section></aside></div>`}
async function run(){if(!id){document.getElementById('main').innerHTML='<div class="card"><h2>TEAM NOT FOUND</h2></div>';return}const {data:t,error}=await sb.from('hff_teams').select('*').eq('id',id).eq('program','rep').maybeSingle();if(error||!t){document.getElementById('main').innerHTML='<div class="card"><h2>TEAM NOT FOUND</h2></div>';return}team=t;const [{data:p},{data:links}]=await Promise.all([sb.from('hff_team_pages').select('*').eq('team_id',id).maybeSingle(),sb.from('hff_event_teams').select('id,side,score,result,video_url,hff_events(*)').eq('team_id',id)]);page=p||{};dates=Array.isArray(page.important_dates)?page.important_dates:[];const girls=String(team.gender||'').toLowerCase()==='girls';document.documentElement.style.setProperty('--accent',girls?'#ed4990':'#d5ad2e');document.title=`Hanover Hustle | ${team.team_name}`;const events=(links||[]).map(x=>({...x.hff_events,link:x})).filter(Boolean).sort((a,b)=>(a.event_date||'').localeCompare(b.event_date||'')||(a.start_time||'').localeCompare(b.start_time||''));render(events);if(edit){if(await adminOK())enableEditor();else location.href='admin-dashboard.html'}}run();
</script></body></html>
