<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | Hanover Flag Football</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="site-theme.css?v=20261004">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#111;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:42px auto;padding:0 18px 50px}.card{background:#fff;border:1px solid #ddd;padding:28px;border-radius:10px}h1{margin:0 0 8px;font-size:28px}p{line-height:1.5}.intro{color:#555;margin:0 0 22px}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #aaa;border-radius:5px;font-size:16px}.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:5px;background:#111;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:16px;padding:12px;background:#f2f2f2;border-radius:5px;display:none;line-height:1.45}.hidden{display:none}.back{display:inline-block;margin-top:18px;color:#111;font-weight:700}
</style>
</head>
<body>
<div id="site-nav"></div>
<main class="wrap"><div class="card">
<h1>Create New Password</h1>
<p class="intro">Enter a new password for your Hanover Flag Football account.</p>
<div id="form" class="hidden">
<label for="password">New Password</label><input id="password" type="password" autocomplete="new-password">
<label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password">
<button class="btn" id="saveBtn">Save New Password</button>
</div>
<div class="status" id="status"></div>
<a class="back hidden" id="accountLink" href="account.html">Back to Sign In</a>
</div></main>
<script src="nav.js"></script>
<script>
const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');
const $=id=>document.getElementById(id);
function showStatus(text,bad=false){$('status').style.display='block';$('status').textContent=text;$('status').style.borderLeft=`4px solid ${bad?'#a00':'#188038'}`}
async function prepareRecovery(){
  showStatus('Opening your secure password reset…');
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  if(code){
    const {error}=await sb.auth.exchangeCodeForSession(code);
    if(error){showStatus('This password reset link is invalid or has expired. Please request a new one from the Sign In page.',true);$('accountLink').classList.remove('hidden');return;}
    history.replaceState({},document.title,location.pathname);
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showStatus('This password reset link is invalid or has expired. Please request a new one from the Sign In page.',true);$('accountLink').classList.remove('hidden');return;}
  $('status').style.display='none';$('form').classList.remove('hidden');
}
$('saveBtn').onclick=async()=>{
  const password=$('password').value,confirm=$('confirmPassword').value;
  if(password.length<6)return showStatus('Password must be at least 6 characters.',true);
  if(password!==confirm)return showStatus('The passwords do not match.',true);
  $('saveBtn').disabled=true;
  const {error}=await sb.auth.updateUser({password});
  if(error){$('saveBtn').disabled=false;return showStatus(error.message,true);}
  showStatus('Your password has been updated. Taking you to My HFF…');
  setTimeout(()=>location.href='my-hff.html',900);
};
prepareRecovery();
</script>
</body>
</html>
