<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFF Teams Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin-nav.js"></script>
<style>:root{--line:#d9dee7;--page:#f4f5f7;--muted:#667085;--bad:#b42318;--good:#16723a}*{box-sizing:border-box}body{margin:0;background:var(--page);font-family:Arial,Helvetica,sans-serif;color:#111827}.wrap{max-width:1200px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.head h1{margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}.card h2{margin:0 0 14px;border-bottom:3px solid #000;padding-bottom:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-size:.78rem;font-weight:800;display:block;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #cbd2dc;border-radius:5px;background:#fff;font:inherit}.btn{border:0;border-radius:5px;padding:10px 13px;font-weight:800;cursor:pointer;background:#000;color:#fff}.light{background:#e9edf2;color:#111}.danger{background:#b42318}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.small,.status{font-size:.82rem;color:var(--muted)}.hidden{display:none!important}.login{max-width:460px;margin:55px auto}.team{border:1px solid #e1e5eb;border-radius:7px;margin:12px 0;background:#fafbfc}.teamtop{padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}.teamtop h3{margin:0 0 4px}.teamdetail{border-top:1px solid #e1e5eb;padding:14px;background:#fff}.member{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eceff3;font-size:.7rem;font-weight:800}.connected{color:var(--good)}.pending{color:#9a6700}.summary{font-size:.78rem;color:var(--muted)}@media(max-width:700px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.member{align-items:flex-start;flex-direction:column}}</style></head><body>
<div id="login" class="wrap login"><div class="card"><h2>Teams Admin Login</h2><div class="grid"><div class="full"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="full"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="full"><button class="btn" id="loginBtn">Sign In</button><div class="status" id="loginStatus"></div></div></div></div></div>
<div id="app" class="wrap hidden"><div class="head"><div><h1>Teams</h1><div class="small">Create House and Hanover Hustle teams. Members can be added before they create an HFF account.</div></div><button class="btn light" id="logoutBtn">Sign Out</button></div>
<section class="card"><h2>Create Team</h2><div class="grid"><div><label>Season</label><input id="season" type="number" value="2027"></div><div><label>Program</label><select id="program"><option value="house">House League</option><option value="rep">Hanover Hustle / Rep</option></select></div><div><label>Team Name</label><input id="teamName" placeholder="e.g. Ravens or Hanover Hustle U16 Girls"></div><div><label>Division</label><input id="division" placeholder="e.g. U12, U16"></div><div><label>Gender</label><select id="gender"><option value="">Not specified</option><option>Co-ed</option><option>Girls</option><option>Boys</option></select></div><div class="row" style="align-items:end"><button class="btn" id="createTeam">Create Team</button></div><div class="full status" id="createStatus"></div></div></section>
<section class="card"><h2>Teams</h2><div id="teams"><div class="status">Loading teams…</div></div></section></div>
<script>
const sb=supabase.createClient('https://wnhzgxnwlmohfldnhhyt.supabase.co','sb_publishable_x5Xkl7tfpUwhz_ENftiaqQ_am915vqY');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function isAdmin(session){if(!session)return false;const {data}=await sb.from('hff_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();return !!data}
async function show(session){if(!(await isAdmin(session))){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');loadTeams()}
$('loginBtn').onclick=async()=>{ $('loginStatus').textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=error?error.message:''};$('logoutBtn').onclick=()=>sb.auth.signOut();
$('createTeam').onclick=async()=>{const name=$('teamName').value.trim();if(!name){$('createStatus').textContent='Enter a team name.';return}$('createStatus').textContent='Creating…';const {error}=await sb.from('hff_teams').insert({season:+$('season').value,program:$('program').value,team_name:name,division:$('division').value.trim()||null,gender:$('gender').value||null});if(error){$('createStatus').textContent=error.message;return}$('teamName').value='';$('division').value='';$('createStatus').textContent='Team created.';loadTeams()};
async function loadTeams(){const {data,error}=await sb.from('hff_teams').select('*').order('season',{ascending:false}).order('program').order('team_name');if(error){$('teams').innerHTML=`<div class="status">${esc(error.message)}</div>`;return}if(!data?.length){$('teams').innerHTML='<div class="status">No teams created yet.</div>';return}let html='';for(const t of data){const [{data:tp},{data:staff}]=await Promise.all([sb.from('hff_team_players').select('id,player_id,jersey_number,hff_players(id,first_name,last_name)').eq('team_id',t.id),sb.from('hff_team_staff').select('*').eq('team_id',t.id)]);let players=tp||[];let guardians=[];if(players.length){const ids=players.map(x=>x.player_id);const {data:g}=await sb.from('hff_player_guardians').select('*').in('player_id',ids);guardians=g||[]}const connected=guardians.filter(g=>g.user_id).length;const pending=guardians.filter(g=>!g.user_id).length;html+=`<div class="team"><div class="teamtop" onclick="toggleTeam('${t.id}')"><div><h3>${esc(t.team_name)}</h3><div class="small">${t.season} · ${t.program==='rep'?'Hanover Hustle / Rep':'House League'}${t.division?' · '+esc(t.division):''}${t.gender?' · '+esc(t.gender):''}</div><div class="summary">${players.length} player${players.length===1?'':'s'} · ${connected} connected · ${pending} invitation${pending===1?'':'s'} needed</div></div><span class="badge">Manage</span></div><div class="teamdetail hidden" id="team-${t.id}">${renderTeam(t,players,guardians,staff||[])}</div></div>`} $('teams').innerHTML=html}
function renderTeam(t,players,guardians,staff){const playerRows=players.map(p=>{const gs=guardians.filter(g=>g.player_id===p.player_id);return `<div class="member"><div><b>${esc(p.hff_players?.first_name)} ${esc(p.hff_players?.last_name||'')}</b>${p.jersey_number?` <span class="badge">#${esc(p.jersey_number)}</span>`:''}<div class="small">${gs.map(g=>`${esc(g.guardian_email)} <span class="${g.user_id?'connected':'pending'}">${g.user_id?'Connected':'No account'}</span>`).join('<br>')||'No guardian email'}</div></div></div>`}).join('')||'<div class="small">No players yet.</div>';const staffRows=staff.map(s=>`<div class="member"><div><b>${esc(s.display_name)}</b> <span class="badge">${esc(s.role.replace('_',' '))}</span><div class="small">${esc(s.email)} · <span class="${s.user_id?'connected':'pending'}">${s.user_id?'Connected':'No account'}</span></div></div></div>`).join('')||'<div class="small">No staff yet.</div>';return `<div class="grid"><div class="full"><h3>Add Player</h3></div><div><label>Player First Name</label><input id="pf-${t.id}"></div><div><label>Player Last Name</label><input id="pl-${t.id}"></div><div><label>Guardian Name</label><input id="gn-${t.id}" placeholder="Optional"></div><div><label>Guardian Email</label><input id="ge-${t.id}" type="email"></div><div><label>Jersey Number</label><input id="jn-${t.id}" placeholder="Optional"></div><div class="row" style="align-items:end"><button class="btn" onclick="addPlayer('${t.id}')">Add Player</button></div><div class="full status" id="ps-${t.id}"></div><div class="full"><h3>Players</h3>${playerRows}</div><div class="full"><hr><h3>Add Team Staff</h3></div><div><label>Name</label><input id="sn-${t.id}"></div><div><label>Email</label><input id="se-${t.id}" type="email"></div><div><label>Role</label><select id="sr-${t.id}"><option value="coach">Coach</option><option value="assistant_coach">Assistant Coach</option><option value="manager">Manager</option></select></div><div class="row" style="align-items:end"><button class="btn" onclick="addStaff('${t.id}')">Add Staff</button></div><div class="full status" id="ss-${t.id}"></div><div class="full"><h3>Staff</h3>${staffRows}</div></div>`}
window.toggleTeam=id=>$("team-"+id).classList.toggle('hidden');
window.addPlayer=async team=>{const first=$('pf-'+team).value.trim(),last=$('pl-'+team).value.trim(),email=$('ge-'+team).value.trim().toLowerCase(),gname=$('gn-'+team).value.trim(),jersey=$('jn-'+team).value.trim();const out=$('ps-'+team);if(!first||!email){out.textContent='Player first name and guardian email are required.';return}out.textContent='Adding…';const {data:p,error:pe}=await sb.from('hff_players').insert({first_name:first,last_name:last||null}).select().single();if(pe){out.textContent=pe.message;return}const {data:prof}=await sb.from('hff_profiles').select('user_id').eq('email',email).maybeSingle();const {error:ge}=await sb.from('hff_player_guardians').insert({player_id:p.id,user_id:prof?.user_id||null,guardian_email:email,guardian_name:gname||null});if(ge){out.textContent=ge.message;return}const {error:te}=await sb.from('hff_team_players').insert({team_id:team,player_id:p.id,jersey_number:jersey||null});if(te){out.textContent=te.message;return}out.textContent=prof?'Player added and account connected.':'Player added. Guardian does not have an HFF account yet.';loadTeams()};
window.addStaff=async team=>{const name=$('sn-'+team).value.trim(),email=$('se-'+team).value.trim().toLowerCase(),role=$('sr-'+team).value,out=$('ss-'+team);if(!name||!email){out.textContent='Name and email are required.';return}out.textContent='Adding…';const {data:prof}=await sb.from('hff_profiles').select('user_id').eq('email',email).maybeSingle();const {error}=await sb.from('hff_team_staff').insert({team_id:team,user_id:prof?.user_id||null,email,display_name:name,role});out.textContent=error?error.message:(prof?'Staff added and account connected.':'Staff added. This person does not have an HFF account yet.');if(!error)loadTeams()};
sb.auth.onAuthStateChange((_e,s)=>show(s));sb.auth.getSession().then(({data})=>show(data.session));
</script></body></html>
